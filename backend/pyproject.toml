[project]
name = "nudge"
version = "0.2.0"
description = "Backend for Nudge, an open-source, self-hostable task manager."
license = "MIT"
authors = [{ name = "Akshay Prabhu" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "django-storages[s3]>=1.14.6",
    "django-stubs-ext>=6.1.2",
    "fractional-indexing>=0.1.3",
    "gunicorn>=26.2.0",
    "icalendar>=7.3",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dateutil>=2.9.0.post0",
    "pywebpush>=2.5.0",
    "tzdata>=2026.5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.1",
    "ruff>=0.17.2",
    "types-boto3[s3]>=1.43.118",
    "types-python-dateutil>=2.9.0.20261021",
    "watchfiles>=1.3.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py314"
# Generated migrations are excluded even when a hook passes them by name.
extend-exclude = ["**/migrations/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter.
    "COM812",
    "ISC001",
    # The project targets English-only docstrings; no need to flag every non-imperative mood edge case.
    "D401",
    # Django's own patterns (Meta classes, settings modules) trip these without adding value.
    "RUF012",
    # TODO markers are tracked in issues, not linted.
    "TD",
    "FIX",
    # The LICENSE file covers the whole repository; per-file headers add noise.
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",    # assert is how pytest works
    "PLR2004", # literal values are the point of a test
    "S105",    # test passwords are not secrets
    "S106",
    "D103",    # test names describe the behavior; a docstring would repeat them
    "D104",
]
"**/{api.py,api/*.py}" = [
    "ARG001", # Django Ninja requires every endpoint to accept `request`, used or not
]
"{conftest,gunicorn.conf,manage}.py" = [
    "INP001", # top-level scripts, not part of a package
]
"config/settings.py" = [
    "ERA001", # settings sections are separated with comment banners
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 4
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "explicit-override"]
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "fractional_indexing", "procrastinate.*", "pywebpush.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--no-migrations",
]
testpaths = ["apps", "config"]
filterwarnings = [
    "error",
    # Tests don't run collectstatic, so STATIC_ROOT doesn't exist.
    "ignore:No directory at:UserWarning",
]

[tool.pytest_env]
NUDGE_SECRET_KEY = "test-only-secret-key"
NUDGE_DEBUG = "false"
# Push stays off unless a test sets keys itself, whatever a developer's .env holds.
NUDGE_VAPID_PUBLIC_KEY = ""
NUDGE_VAPID_PRIVATE_KEY = ""
# Attachments stay on the file system unless a test switches to a fake bucket itself.
NUDGE_STORAGE_BUCKET = ""
NUDGE_STORAGE_ENDPOINT_URL = ""
NUDGE_STORAGE_ACCESS_KEY_ID = ""
NUDGE_STORAGE_SECRET_ACCESS_KEY = ""
NUDGE_STORAGE_REGION = ""

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["**/migrations/*", "config/wsgi.py", "config/asgi.py", "manage.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
