# Production stack. Configure everything in .env (see .env.example), then:
#   docker compose pull && docker compose up -d
#
# It runs the image CI publishes for each release; NUDGE_IMAGE_TAG picks the version.
#
# Both services use the host's network so they reach the host's PostgreSQL at the address in
# DATABASE_URL, and the web server listens directly on NUDGE_WEB_HOST:NUDGE_WEB_PORT for the
# reverse proxy (Caddy) on the same machine.

x-nudge: &nudge
  image: ghcr.io/prabhuakshay/nudge:${NUDGE_IMAGE_TAG:-latest}
  network_mode: host
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  # Attachments live on a named volume unless NUDGE_STORAGE_BUCKET is set: the container is
  # read-only, and the worker needs the same files as the web server. Keep it with a bucket too:
  # big uploads and downloads are buffered here rather than in the RAM-backed /tmp. It is
  # mounted wherever NUDGE_MEDIA_ROOT points the app.
  volumes:
    - media:${NUDGE_MEDIA_ROOT:-/app/backend/media}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  web:
    <<: *nudge
    stop_grace_period: 30s

  worker:
    <<: *nudge
    command: ["sh", "-c", "exec python manage.py procrastinate worker --concurrency ${NUDGE_WORKER_CONCURRENCY:-4}"]
    environment:
      # The web service applies migrations; the worker waits for it to be healthy.
      NUDGE_RUN_MIGRATIONS: "false"
    healthcheck:
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 60s
      timeout: 10s
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 60s

volumes:
  media:
