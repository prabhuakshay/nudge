<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Nudge: small pushes, things get done." />
    <title>Nudge</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1D4ED8" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1224" media="(prefers-color-scheme: dark)" />
    <script>
      // Applied before first paint so a saved theme doesn't flash; see src/features/theme.
      try {
        const theme = localStorage.getItem("nudge-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
