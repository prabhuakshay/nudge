version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
